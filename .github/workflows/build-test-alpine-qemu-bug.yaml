name: build-test-alpine-qemu-bug

on:
  workflow_dispatch:
  push:
    branches: alpine-qemu-bug

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: build-test-alpine-qemu-bug
    runs-on: ubuntu-latest
    steps:
      - name: Print Ubuntu version
        run: lsb_release -a
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup QEMU
        if: matrix.needs_qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64
          image: tonistiigi/binfmt:qemu-v10.0.4-56
          cache-image: false
      - name: Setup docker context for buildx
        run: docker context create builders || docker context use builders
        shell: bash
      - name: Setup Docker Buildx
        id: setup_docker_buildx
        uses: docker/setup-buildx-action@v3
        with:
          endpoint: builders
          version: v0.30.1
          cache-binary: false
          driver-opts: |
              image=moby/buildkit:v0.26.2
      - name: Build
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          push: false
          context: .
          platforms: linux/amd64,linux/arm64
          tags: build-test
          provenance: false
